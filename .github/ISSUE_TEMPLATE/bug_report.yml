name: Bug report
description: Report a calculation, accessibility or routing issue
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and expected result
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs and actual result
      description: Never include API keys or private home addresses.
  - type: input
    id: environment
    attributes:
      label: Browser, device and app version
