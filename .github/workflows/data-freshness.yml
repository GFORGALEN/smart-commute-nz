name: Data freshness
# Dated tables expire without any code change, so this runs weekly, not only on pushes.
# A failure means a published table (such as AT fares) needs refreshing within a month.
on:
  schedule:
    - cron: '0 20 * * 0' # Monday 08:00 or 09:00 in Auckland
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/providers/src/data-freshness.test.ts
