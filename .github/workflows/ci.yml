name: Quality and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_MAPS_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          VITE_BASE_PATH: /smart-commute-nz/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: '1'
          VITE_BASE_PATH: /smart-commute-nz/
      - name: Build Pages with the configured browser key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_API_KEY" ]; then
            echo "Configure the VITE_GOOGLE_MAPS_API_KEY repository secret before deploying."
            exit 1
          fi
          npm run build
        env:
          VITE_BASE_PATH: /smart-commute-nz/
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-diagnostics
          path: |
            playwright-report
            test-results
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
